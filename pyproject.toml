# Repository-wide tool configuration.
# The installable packages live in libs/forensicwace_core and services/api.

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Critical-only baseline: syntax errors, invalid literal comparisons,
# forgotten debug artifacts, undefined names. Widened as the codebase matures.
select = ["E9", "F63", "F7", "F82"]
