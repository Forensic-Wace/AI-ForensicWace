[project]
name = "ForensicWace-SE"
description = "Forensic WACE SE - Forensic WhatsApp Chat Extractor Server Edition"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Windows",
    "Operating System :: POSIX :: Linux"
]
version = "1.0.0"

dependencies = [
    "Pillow",
    "cryptography",
    "Flask",
    "rfc3161ng",
    "vobject",
    "iOSbackup",
    "reportlab",
    "protobuf-decoder",
    "iOSbackup",
    "bleach"
]

[project.scripts]
forensic-wace-se = "forensicWace_SE.main:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.package-data]
"forensicWace_SE.assets" = ["*.*"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# Critical-only baseline for the research-grade codebase: syntax errors,
# invalid literal comparisons, forgotten debug artifacts, undefined names.
# The rule set will be widened as the refactor phases land.
select = ["E9", "F63", "F7", "F82"]
