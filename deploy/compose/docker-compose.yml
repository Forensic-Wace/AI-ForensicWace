# Forensic Wace — full local stack.
#
#   docker compose --profile core up --build                    # API + PostgreSQL
#   docker compose --profile core --profile analyzers-local up  # + Whisper & Tesseract
#
# Put evidence extractions in ../../data/device_extractions_IOS and
# ../../data/device_extractions_Android (never commit them) — or upload
# them as ZIPs from the Projects page (stored on MinIO). Web UI at
# http://localhost:3000 (API docs: http://localhost:8080/docs, MinIO
# console: http://localhost:9001)
#
# DeepPass and LAVIS have no public images; clone the forks next to this
# repository and uncomment their services below.

name: forensicwace

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensicwace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensicwace}
      POSTGRES_DB: ${POSTGRES_DB:-forensic_wace}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensicwace}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [core]
    ports:
      - "15672:15672"   # management UI (queues, retries, fw.dead DLQ)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forensicwace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forensicwace}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"   # web console (bucket is created automatically by the API)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      args:
        CORE_EXTRAS: ${CORE_EXTRAS:-postgres,s3}
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      FW_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-forensicwace}:${POSTGRES_PASSWORD:-forensicwace}@postgres:5432/${POSTGRES_DB:-forensic_wace}
      FW_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      FW_DATA_DIR: /data
      FW_S3_ENDPOINT: ${FW_S3_ENDPOINT:-http://minio:9000}
      FW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-forensicwace}
      FW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-forensicwace}
      FW_S3_BUCKET: ${FW_S3_BUCKET:-forensicwace-evidence}
      FW_DEEPPASS_ENDPOINT: ${FW_DEEPPASS_ENDPOINT:-}
      FW_WHISPER_ENDPOINT: ${FW_WHISPER_ENDPOINT:-http://whisper:9000/asr}
      FW_TESSERACT_ENDPOINT: ${FW_TESSERACT_ENDPOINT:-http://tesseract:8884/v1/ocr}
      FW_LAVIS_ENDPOINT: ${FW_LAVIS_ENDPOINT:-}
      FW_HF_TOKEN: ${FW_HF_TOKEN:-}
      FW_OPENAI_API_KEY: ${FW_OPENAI_API_KEY:-}
      FW_OPENAI_ASSISTANT_ID: ${FW_OPENAI_ASSISTANT_ID:-}
      FW_MS_PII_ENDPOINT: ${FW_MS_PII_ENDPOINT:-}
      FW_MS_PII_KEY: ${FW_MS_PII_KEY:-}
      FW_MS_S2T_KEY: ${FW_MS_S2T_KEY:-}
      FW_MS_S2T_REGION: ${FW_MS_S2T_REGION:-}
      FW_MS_CV_ENDPOINT: ${FW_MS_CV_ENDPOINT:-}
      FW_MS_CV_KEY: ${FW_MS_CV_KEY:-}
      FW_USE_MS_S2T: ${FW_USE_MS_S2T:-false}
      FW_USE_MS_OCR_CAPTION: ${FW_USE_MS_OCR_CAPTION:-false}
      FW_USE_MS_PII: ${FW_USE_MS_PII:-false}
      FW_USE_OPENAI_GPT: ${FW_USE_OPENAI_GPT:-false}
    volumes:
      - ../../data:/data
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
      args:
        CORE_EXTRAS: ${CORE_EXTRAS:-postgres,s3}
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      FW_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-forensicwace}:${POSTGRES_PASSWORD:-forensicwace}@postgres:5432/${POSTGRES_DB:-forensic_wace}
      FW_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      FW_DATA_DIR: /data
      FW_S3_ENDPOINT: ${FW_S3_ENDPOINT:-http://minio:9000}
      FW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-forensicwace}
      FW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-forensicwace}
      FW_S3_BUCKET: ${FW_S3_BUCKET:-forensicwace-evidence}
      FW_DEEPPASS_ENDPOINT: ${FW_DEEPPASS_ENDPOINT:-}
      FW_WHISPER_ENDPOINT: ${FW_WHISPER_ENDPOINT:-http://whisper:9000/asr}
      FW_TESSERACT_ENDPOINT: ${FW_TESSERACT_ENDPOINT:-http://tesseract:8884/v1/ocr}
      FW_LAVIS_ENDPOINT: ${FW_LAVIS_ENDPOINT:-}
      FW_HF_TOKEN: ${FW_HF_TOKEN:-}
      FW_OPENAI_API_KEY: ${FW_OPENAI_API_KEY:-}
      FW_OPENAI_ASSISTANT_ID: ${FW_OPENAI_ASSISTANT_ID:-}
      FW_MS_PII_ENDPOINT: ${FW_MS_PII_ENDPOINT:-}
      FW_MS_PII_KEY: ${FW_MS_PII_KEY:-}
      FW_MS_S2T_KEY: ${FW_MS_S2T_KEY:-}
      FW_MS_S2T_REGION: ${FW_MS_S2T_REGION:-}
      FW_MS_CV_ENDPOINT: ${FW_MS_CV_ENDPOINT:-}
      FW_MS_CV_KEY: ${FW_MS_CV_KEY:-}
      FW_USE_MS_S2T: ${FW_USE_MS_S2T:-false}
      FW_USE_MS_OCR_CAPTION: ${FW_USE_MS_OCR_CAPTION:-false}
      FW_USE_MS_PII: ${FW_USE_MS_PII:-false}
      FW_USE_OPENAI_GPT: ${FW_USE_OPENAI_GPT:-false}
    volumes:
      - ../../data:/data
    # Horizontal scaling preview (Phase 5 moves this to KEDA on queue depth):
    #   docker compose --profile core up --scale worker=4

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    profiles: [core]
    depends_on:
      - api
    ports:
      - "3000:80"

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    profiles: [analyzers-local]
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-base}
      ASR_ENGINE: openai_whisper
    ports:
      - "9000:9000"

  tesseract:
    image: hertzg/tesseract-server:latest
    profiles: [analyzers-local]
    ports:
      - "7865:8884"

  # fw-analyzer/1 shims: expose the sidecars through the standard analyzer
  # contract so they can be installed at runtime instead of via FW_* env:
  #   curl -X POST http://localhost:8080/api/v1/analyzers \
  #        -H 'Content-Type: application/json' -d '{"endpoint": "http://whisper-shim:9300"}'
  #   curl ... -d '{"endpoint": "http://tesseract-shim:9300"}'
  whisper-shim:
    build:
      context: ../..
      dockerfile: services/analyzer-shim/Dockerfile
    profiles: [analyzers-local]
    environment:
      FW_SHIM_TARGET: whisper
      FW_SHIM_TARGET_URL: http://whisper:9000/asr
    depends_on:
      - whisper

  tesseract-shim:
    build:
      context: ../..
      dockerfile: services/analyzer-shim/Dockerfile
    profiles: [analyzers-local]
    environment:
      FW_SHIM_TARGET: tesseract
      FW_SHIM_TARGET_URL: http://tesseract:8884/v1/ocr
    depends_on:
      - tesseract

  # deeppass:
  #   build: ../../../DeepPass_RestApi   # git clone https://github.com/daniele96/DeepPass_RestApi
  #   profiles: [analyzers-local]
  #   ports:
  #     - "5000:5000"
  # deeppass-shim:
  #   build: { context: ../.., dockerfile: services/analyzer-shim/Dockerfile }
  #   profiles: [analyzers-local]
  #   environment: { FW_SHIM_TARGET: deeppass, FW_SHIM_TARGET_URL: "http://deeppass:5000" }
  #   depends_on: [deeppass]

  # lavis:
  #   build: ../../../ImageCaption_lavis  # git clone https://github.com/daniele96/ImageCaption_lavis
  #   profiles: [analyzers-local]
  #   ports:
  #     - "7866:5000"
  # lavis-shim:
  #   build: { context: ../.., dockerfile: services/analyzer-shim/Dockerfile }
  #   profiles: [analyzers-local]
  #   environment: { FW_SHIM_TARGET: lavis, FW_SHIM_TARGET_URL: "http://lavis:5000" }
  #   depends_on: [lavis]

volumes:
  postgres-data:
  minio-data:
