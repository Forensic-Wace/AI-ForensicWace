[project]
name = "forensicwace-worker"
description = "Forensic Wace analysis workers (Celery)"
requires-python = ">=3.10"
license = { text = "MIT" }
version = "2.0.0a1"

dependencies = [
    "celery>=5.4",
    # forensicwace-core is installed from the monorepo path:
    #   pip install -e libs/forensicwace_core -e services/worker
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensicwace_worker*"]
