[project]
name = "forensicwace-analyzer-shim"
description = "fw-analyzer/1 shim: wraps the historical analyzer sidecars (DeepPass, Whisper, Tesseract, LAVIS) in the standard contract"
requires-python = ">=3.10"
license = { text = "MIT" }
version = "1.0.0"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensicwace_analyzer_shim*"]
