[project]
name = "forensicwace-api"
description = "Forensic Wace REST API service"
requires-python = ">=3.10"
license = { text = "MIT" }
version = "2.0.0a1"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # forensicwace-core is installed from the monorepo path:
    #   pip install -e libs/forensicwace_core -e services/api
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensicwace_api*"]
