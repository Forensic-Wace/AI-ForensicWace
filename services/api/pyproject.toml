[project]
name = "forensicwace-api"
description = "Forensic Wace REST API service"
requires-python = ">=3.10"
license = { text = "MIT" }
version = "2.0.0a1"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.8",  # [crypto]: RS256/ES256 ID-token validation (OIDC)
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "celery>=5.4",
    "prometheus-fastapi-instrumentator>=7.0",
    # forensicwace-core is installed from the monorepo path:
    #   pip install -e libs/forensicwace_core -e services/api
]

[project.optional-dependencies]
# analyzer runtime provisioning (marketplace phase C)
k8s = ["kubernetes>=29"]
docker = ["docker>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensicwace_api*"]
