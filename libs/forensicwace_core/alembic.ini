# Alembic CLI configuration for contributors (runtime upgrades run
# programmatically via forensicwace_core.resultsdb.engine.init_db).
#
#   cd libs/forensicwace_core
#   FW_DATABASE_URL=... alembic revision -m "add xyz"
#   FW_DATABASE_URL=... alembic upgrade head

[alembic]
script_location = forensicwace_core/resultsdb/migrations
# the connection URL comes from FW_DATABASE_URL (see migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
