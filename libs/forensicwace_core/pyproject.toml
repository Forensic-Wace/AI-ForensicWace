[project]
name = "forensicwace-core"
description = "Forensic Wace core library: WhatsApp evidence extraction, AI analysis pipeline, forensic reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
version = "2.0.0a1"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "reportlab>=4.0",
    "rfc3161ng>=2.1",
    "protobuf-decoder>=0.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
presidio = ["presidio-analyzer>=2.2"]
starpii = ["transformers>=4.40", "torch"]
azure = [
    "azure-ai-textanalytics",
    "azure-cognitiveservices-speech",
    "azure-ai-vision-imageanalysis",
    "azure-core",
]
openai = ["openai>=1.30"]
all = ["forensicwace-core[postgres,presidio,starpii,azure,openai]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensicwace_core*"]
