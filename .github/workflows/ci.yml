name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check libs/ services/

  evidence-guard:
    name: Evidence data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if evidence-like files are tracked
        run: |
          MATCHES=$(git ls-files | grep -iE '(device_extractions|ChatStorage\.sqlite|msgstore.*\.db|wa\.db|Manifest\.(db|plist))' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Evidence-like files must never be committed:"
            echo "$MATCHES"
            exit 1
          fi

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/forensicwace
      - name: Render templates (default + keda + external infra)
        run: |
          helm template fw deploy/helm/forensicwace > /dev/null
          helm template fw deploy/helm/forensicwace --set worker.keda.enabled=true > /dev/null
          helm template fw deploy/helm/forensicwace \
            --set postgresql.enabled=false --set rabbitmq.enabled=false \
            --set postgresql.externalUrl=postgresql+psycopg2://u:p@h:5432/db \
            --set rabbitmq.externalUrl=amqp://u:p@h:5672// \
            --set ingress.enabled=true > /dev/null

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e libs/forensicwace_core -e services/api -e services/worker pytest httpx
      - run: pytest libs/forensicwace_core/tests services/api/tests services/worker/tests -q
